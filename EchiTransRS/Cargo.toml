[package]
name = "ramen-listen"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "GPU-first offline speech-to-text + local Hy-MT2 translation overlay"

[dependencies]
anyhow = "1"
cpal = "0.15"
directories = "5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ferrous-opencc = "0.4" # 純 Rust OpenCC 字形及台灣詞彙轉換，無 DLL/Python
qwen3-asr-wgpu = { git = "https://github.com/eclipse005/qwen3-asr-wgpu.git", rev = "bd237be2" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
